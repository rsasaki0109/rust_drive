name: Camera preprocessing compatibility and fresh BDD diagnostics
on:
  push:
    paths:
      - '.github/workflows/camera-linear.yml'
      - 'integrations/onnx/**'
      - 'assets/camera-linear-v1/**'
      - 'rust-toolchain.toml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  camera-preprocessing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and independent OpenCV reference
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install -r scripts/requirements-visual.txt opencv-python-headless==4.13.0.92
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            integrations/onnx/target
          key: camera-linear-${{ runner.os }}-rust-1.90-${{ hashFiles('integrations/onnx/Cargo.lock') }}
      - name: Verify frozen evidence, input bounds and corruption controls
        run: |
          cargo fmt --manifest-path integrations/onnx/Cargo.toml -- --check
          cargo clippy --release --locked --manifest-path integrations/onnx/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path integrations/onnx/Cargo.toml --bin rustdriving-camera-linear
          cargo build --release --locked --manifest-path integrations/onnx/Cargo.toml --bin rustdriving-camera-linear
          python -B -m unittest discover -s integrations/onnx -p 'test_camera_linear*.py' -v
          python -B assets/camera-linear-v1/verify.py
      - name: Acquire exactly the pinned model and original BDD images
        run: |
          python -B integrations/onnx/fetch.py --output artifacts/camera-model
          python -B integrations/onnx/bdd_fetch.py --output artifacts/bdd-camera
          python -B integrations/onnx/camera_linear_fetch.py --output artifacts/camera-linear-check/data
      - name: Check independent pixels before fixed-order model evaluation
        run: |
          python -B integrations/onnx/camera_linear_check.py controls --data artifacts/camera-linear-check/data --output artifacts/camera-linear-check/controls
          python -B integrations/onnx/camera_linear_check.py run --data artifacts/camera-linear-check/data --controls artifacts/camera-linear-check/controls --output artifacts/camera-linear-check/validation
          python -B integrations/onnx/camera_linear_check.py audit --data artifacts/camera-linear-check/data --controls artifacts/camera-linear-check/controls --output artifacts/camera-linear-check/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-linear-diagnostics
          path: |
            artifacts/camera-linear-check/data/inputs.json
            artifacts/camera-linear-check/controls/summary.json
            artifacts/camera-linear-check/controls/*-pixels.json
            artifacts/camera-linear-check/validation/
