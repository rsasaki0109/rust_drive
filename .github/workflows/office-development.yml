name: City life model and visual checks
on:
  push:
    branches: [codex/city-life]
permissions:
  contents: read
concurrency:
  group: city-life-development
  cancel-in-progress: true
jobs:
  models-and-views:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
      RUSTDRIVING_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: npm ci --prefix web --ignore-scripts
      - name: Check actual traffic, doors, shifts and train transfers
        run: node --test web/tests/fleet.test.mjs web/tests/city-life.test.mjs web/tests/fleet-places.test.mjs web/tests/traffic-junctions.test.mjs web/tests/traffic.test.mjs
      - name: Build the real game and install Chromium
        run: |
          bash scripts/build-playground.sh
          python -m pip install playwright==1.56.0 pillow==12.0.0
          python -m playwright install --with-deps chromium
      - name: Exercise the office, nightlife and railway views
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > /tmp/city-life-proof-preview.log 2>&1 &
          rustdriving_proof_pid=$!
          trap 'kill "$rustdriving_proof_pid" || true' EXIT
          python - <<'PY'
          import os, time, urllib.request
          url = 'http://127.0.0.1:4173' + os.environ['PAGES_BASE']
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=1): break
              except OSError: time.sleep(.25)
          else: raise SystemExit('City preview did not start')
          PY
          python web/tests/fleet_smoke.py --url "http://127.0.0.1:4173$PAGES_BASE" --output web/test-results/city-life-proof --proof-only
      - name: Return the real rendered PNGs for visual review
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for path in sorted(Path('web/test-results/city-life-proof').rglob('*.png')):
              print('IMAGE_BEGIN:' + path.as_posix(), flush=True)
              print(base64.encodebytes(path.read_bytes()).decode('ascii'), flush=True)
              print('IMAGE_END:' + path.as_posix(), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-life-early-proof
          path: web/test-results/city-life-proof
