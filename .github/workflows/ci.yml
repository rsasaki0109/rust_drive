          target/release/rustdriving-dataset-eval adaptive-ground --dataset pdal-autzen --split fresh_heldout --freeze assets/adaptive-ground-renamed-freeze.json --output artifacts/adaptive/fresh.json
          python scripts/check-adaptive-ground.py --report artifacts/adaptive/fresh.json --freeze assets/adaptive-ground-renamed-freeze.json --output artifacts/adaptive/fresh-oracle.json
      - name: Check recorded natural-motion registration and retained failures
        run: |
