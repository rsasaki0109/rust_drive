name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Run closed-loop acceptance demo
        run: cargo run --release --locked --bin rustdrive -- run --scenario scenarios/mission.json --seed 7 --output artifacts/demo
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ matrix.os }}
          path: artifacts/demo/
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: python -m pip install -r scripts/requirements-demo.txt
      - name: Regenerate the actual demo
        run: bash scripts/demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: artifacts/demo/demo.*
