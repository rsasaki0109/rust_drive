          assert proof["pass_checks"] is True
          assert proof["original_images"] == 16 and proof["repeats_per_image"] == 2
          assert proof["complete_original_measurement_and_result_parity"] is True
          assert proof["actual_measured_parallel_replay"] is True
          assert proof["current_host_reference_exact"] is True
          assert proof["current_reference_model_forwards"] == 64
          assert proof["total_actual_model_forwards"] == 208
          assert proof["age_limit_s"] == .2
          assert proof["hardware_speedup_required_for_success"] is False
          assert proof["inherited_quality_gates_pass"] is False
