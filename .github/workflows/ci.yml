name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        # The observed macos-latest ARM pool repeatedly failed to acquire a runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdrive-rustup" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Run closed-loop acceptance demo
        run: cargo run --release --locked --bin rustdrive -- run --scenario scenarios/mission.json --seed 7 --output artifacts/demo
      - name: Recompute sensor log
        run: cargo run --release --locked --bin rustdrive -- replay --log artifacts/demo/sensors.jsonl --output artifacts/demo/replay
      - name: Drive mapped destinations, closure detour and mapped road rules
        shell: bash
        run: |
          for case in route-direct route-detour route-south route-handover route-no-path route-reopen signal-red-green signal-red-stop signal-stale-stop signal-stale-recovery signal-two-stops signal-approach-change stop-sign-single stop-sign-two stop-sign-signal stop-sign-obstacle stop-sign-gnss-recovery intersection-crossing intersection-successive intersection-blocked intersection-gnss-recovery intersection-stop-sign intersection-fast-wide intersection-slow-narrow intersection-two-zones intersection-delay-two intersection-lidar-recovery intersection-cadence-five-hz intersection-late-conflict intersection-late-delayed; do
            cargo run --release --locked --bin rustdrive -- run --scenario "scenarios/$case.json" --seed 7 --output "artifacts/routing/$case"
            cargo run --release --locked --bin rustdrive -- replay --log "artifacts/routing/$case/sensors.jsonl" --output "artifacts/routing/$case/replay"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ matrix.os }}
          path: |
            artifacts/demo/
            artifacts/routing/
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdrive-rustup" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r scripts/requirements-demo.txt
      - name: Regenerate the actual demo
        run: bash scripts/demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: artifacts/demo/demo.*

  rne-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust_drive
      - uses: actions/checkout@v4
        with:
          repository: rsasaki0109/RobotNativeEngine
          ref: df6007aa40315e81d12ae00fc1f60369e393a178
          path: RobotNativeEngine
          sparse-checkout: |
            crates
            third_party
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdrive-rustup" >> "$GITHUB_ENV"
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify engine pin and CPU adapter
        working-directory: rust_drive
        run: |
          test "$(git -C ../RobotNativeEngine rev-parse HEAD)" = "$(cat integrations/rne/rne-revision.txt)"
          cargo +1.95.0 fmt --manifest-path integrations/rne/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path integrations/rne/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.95.0 test --manifest-path integrations/rne/Cargo.toml --locked
      - name: Run both native plants and verify logs
        working-directory: rust_drive
        run: |
          for plant in kinematic dynamic; do
            cargo +1.95.0 run --release --locked --manifest-path integrations/rne/Cargo.toml -- --scenario scenarios/mission.json --plant "$plant" --seed 7 --output "artifacts/rne-$plant"
            cargo run --release --locked --bin rustdrive -- replay --log "artifacts/rne-$plant/sensors.jsonl" --output "artifacts/rne-$plant/replay"
          done
      - name: Run multi-seed hazard acceptance and full replay
        working-directory: rust_drive
        run: python3 scripts/check_hazards.py
      - name: Independently check native scenes, multi-height sensing and remaining blind slabs
        working-directory: rust_drive
        run: python3 scripts/check-native-scenes.py --output artifacts/native-scenes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render a real RNE frame in 3D on CPU
        working-directory: rust_drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          python -m pip install -r scripts/requirements-demo.txt
          python scripts/render_demo_3d.py artifacts/rne-dynamic/run.json --preview-time 7.5 --output artifacts/rne-dynamic/preview-3d.gif --samples 4 --threads 2 --scene-output artifacts/rne-dynamic/scene-3d.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/traffic-fleet-queue/seed-7/run.json --preview-time 30 --traffic-models sedan van pickup --camera traffic --output artifacts/rne-fleet/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-fleet/scene.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/signal-red-green/seed-7/run.json --preview-time 15 --output artifacts/rne-signals/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-signals/scene.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/stop-sign-single/seed-7/run.json --preview-time 10.5 --output artifacts/rne-stop-signs/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-stop-signs/scene.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/intersection-crossing/seed-7/run.json --preview-time 11 --output artifacts/rne-intersection/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-intersection/scene.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/intersection-lidar-recovery/seed-7/run.json --preview-time 14.1 --output artifacts/rne-timing/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-timing/scene.blend
          python scripts/render_demo_3d.py artifacts/hazards/rne-dynamic/intersection-late-conflict/seed-7/run.json --preview-time 30 --output artifacts/rne-late-crossing/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-late-crossing/scene.blend
          python scripts/render_demo_3d.py artifacts/native-scenes/dynamic/ground-barrier/seed-7/run.json --native-scene artifacts/native-scenes/dynamic/ground-barrier/seed-7/scene.json --preview-time 15 --output artifacts/rne-native-scene/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-native-scene/scene.blend
          python scripts/render_demo_3d.py artifacts/native-scenes/multi-height/dynamic/blind-low-slab/seed-7/run.json --native-scene artifacts/native-scenes/multi-height/dynamic/blind-low-slab/seed-7/scene.json --preview-time 15 --output artifacts/rne-multi-height/preview.gif --samples 4 --threads 2 --scene-output artifacts/rne-multi-height/scene.blend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rne-hazard-evidence
          path: |
            rust_drive/artifacts/hazards/
            rust_drive/artifacts/native-scenes/
      - uses: actions/upload-artifact@v4
        with:
          name: rne-cpu-telemetry
          path: rust_drive/artifacts/rne-*/
