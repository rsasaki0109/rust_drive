name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  rust:
    strategy:
      matrix:
        # The observed macos-latest ARM pool repeatedly failed to acquire a runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdriving-rustup" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check adversarial prediction evidence
        run: python scripts/test_prediction_evidence.py
      - name: Check contained lane-conflict witnesses
        run: python scripts/test_lane_occupancy.py
      - name: Check swept physical speed intervals
        run: python scripts/test_speed_zones.py
      - name: Check original lane-map speed reconstruction
        run: python scripts/test_lane_speed_zones.py
      - name: Check independent connector arc-length speed mapping
        run: python scripts/test_lane_change_speeds.py
      - name: Check alternate return-policy speed scoring
        run: python scripts/test_lane_return_speeds.py
      - name: Check independent retry-route speed remapping
        run: python scripts/test_lane_resume_speeds.py
      - name: Check closure-aware mapped speed scoring
        run: python scripts/test_navigation_speeds.py
      - name: Check acquisition-time GNSS reconstruction
        run: python scripts/test_gnss_latency.py
      - name: Check correlated GNSS calibration oracle and frozen paired controls
        run: python scripts/test_gnss_covariance.py
      - name: Check deferred GNSS recovery proposals against independent closed forms
        run: python scripts/test_gnss_recovery.py
      - name: Check GNSS antenna geometry against closed-form posteriors
        run: python scripts/test_gnss_antenna.py
      - name: Check lost-motion admission and measured regional recovery
        run: |
          python scripts/test_motion_continuity.py
          python scripts/test_relocalization.py
          python scripts/test_signal_relocalization.py
          python scripts/test_yield_relocalization.py
      - name: Check chronological GNSS and map reconstruction
        run: python scripts/test_gnss_map_history.py
      - name: Check asynchronous map and original GNSS evidence reconstruction
        run: python scripts/test_delayed_map.py
      - name: Check independent partial-edge routing oracle
        run: python scripts/test_mid_edge.py
      - name: Check full initial-pose covariance conditioning and evidence
        run: python scripts/test_initial_pose.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Drive and independently score fixed-route speed intervals
        shell: bash
        run: python scripts/check_speed_zones.py --output artifacts/speed-zones
      - name: Compile lane-map speeds and independently score reference driving
        shell: bash
        run: python scripts/check_lane_speed_zones.py --output artifacts/lane-speed-zones
      - name: Drive fixed lane changes with mapped speeds and observed-gap admission
        shell: bash
        run: python scripts/check_lane_change_speeds.py --output artifacts/lane-change-speeds
      - name: Drive early returns with map-derived alternate speed caps
        shell: bash
        run: python scripts/check_lane_return_speeds.py --output artifacts/lane-return-speeds
      - name: Drive mission retries with mapped connector and tail speeds
        shell: bash
        run: python scripts/check_lane_resume_speeds.py --output artifacts/lane-resume-speeds
      - name: Drive stopped route handovers with original road speed limits
        shell: bash
        run: python scripts/check_navigation_speeds.py --output artifacts/navigation-speeds
      - name: Verify delayed GNSS fusion and fault recovery from original observations
        shell: bash
        run: python scripts/check_gnss_latency.py --output artifacts/gnss-latency
      - name: Verify correlated GNSS and retain known narrow-axis bias failures
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          result = subprocess.run(['python', 'scripts/check_gnss_covariance.py', '--plant', 'reference-2d', '--seeds', '7', '--output', 'artifacts/gnss-covariance'])
          report = json.load(open('artifacts/gnss-covariance/report.json'))
          assert result.returncode == 1 and report['complete'] and not report['passed']
          rows = report['episodes']
          assert len(rows) == 8
          assert all('audit_error' not in r and r['oracle']['passed'] and r['noise_samples_verified'] > 0 and r['replay_exit_code'] == 0 and r['replay']['verified'] for r in rows)
          for row in rows:
              assert row['summary']['reached_goal'] and not row['summary']['collisions'] and not row['summary']['road_violations']
              if row['calibrated']:
                  assert set(row['failed_gates']) == ({'source_acceptance', 'localization_accuracy', 'fault_stop_recovery'} if row['world'].endswith('bias') else set())
              else:
                  assert set(row['failed_gates']) <= {'source_acceptance'}
          PY
      - name: Verify combined delayed GNSS and map localization
        shell: bash
        run: python scripts/check_gnss_map_history.py --output artifacts/gnss-map-history
      - name: Verify bounded GNSS recovery and preserve no-guard and expiry controls
        shell: bash
        run: python scripts/check_gnss_recovery.py --plant reference-2d --smoke --output artifacts/gnss-recovery
      - name: Verify calibrated GNSS antenna mounts with delayed GNSS and maps
        shell: bash
        run: python scripts/check_gnss_antenna.py --plant reference-2d --smoke --output artifacts/gnss-antenna
      - name: Verify stopped motion discontinuities and healthy scene continuity
        shell: bash
        run: python scripts/check_motion_continuity.py --plant reference-2d --smoke --output artifacts/motion-continuity
      - name: Verify measured regional map recovery and rejected resets
        shell: bash
        run: |
          python -m pip install -r scripts/requirements-relocalization.txt
          python scripts/check_relocalization.py --plant reference-2d --smoke --output artifacts/regional-relocalization
      - name: Verify bounded map-only driving after a measured reset
        shell: bash
        run: python scripts/check_relocalization_map_only.py --plant reference-2d --smoke --output artifacts/relocalization-map-only
      - name: Verify measured-reset GNSS confirmations and expired handoffs
        shell: bash
        run: python scripts/check_gnss_handoff.py --plant reference-2d --smoke --output artifacts/gnss-handoff
      - name: Verify navigation missions through measured localization resets
        shell: bash
        run: python scripts/check_navigation_relocalization.py --plant reference-2d --smoke --output artifacts/navigation-relocalization
      - name: Verify braked stopped-route confirmation
        shell: bash
        run: python scripts/check_navigation_handover.py --plant reference-2d --smoke --output artifacts/navigation-handover
      - name: Verify stop-sign obligations after measured localization recovery
        shell: bash
        run: python scripts/check_stop_relocalization.py --plant reference-2d --smoke --output artifacts/stop-relocalization
      - name: Verify new signal permission after measured localization recovery
        shell: bash
        run: python scripts/check_signal_relocalization.py --plant reference-2d --smoke --output artifacts/signal-relocalization
      - name: Verify yield entry ownership and fresh clear scans after measured recovery
        shell: bash
        run: python scripts/check_yield_relocalization.py --plant reference-2d --smoke --output artifacts/yield-relocalization
      - name: Verify delayed map acquisitions and transient fault recovery
        shell: bash
        run: python scripts/check_delayed_map.py --output artifacts/delayed-map --controls
      - name: Exhaustively verify directed interior route requests and every closure subset
        shell: bash
        run: python scripts/check_mid_edge.py --routing-corpus-only --output artifacts/mid-edge-corpus
      - name: Drive and replay partial origins, destinations and closure handovers
        shell: bash
        run: python scripts/check_mid_edge.py --output artifacts/mid-edge
      - name: Drive explicit pose calibration and retain mismatched-calibration controls
        shell: bash
        run: python scripts/check_initial_pose.py --smoke --output artifacts/initial-pose
      - name: Evaluate pinned measured clouds and independently reconstruct scores
        shell: bash
        run: |
          python scripts/test-fetch-datasets.py
          python scripts/fetch-datasets.py
          cargo run --release --locked --bin rustdriving-dataset-eval -- --python python --output artifacts/datasets/report.json
          python scripts/check-datasets.py --report artifacts/datasets/report.json --output artifacts/datasets/oracle.json
      - name: Verify bounded GNSS-denied reference driving and fail-closed controls
        shell: bash
        run: python scripts/check-map-localization.py --backend reference --output artifacts/map-localization
      - name: Run closed-loop acceptance demo
        run: cargo run --release --locked --bin rustdriving -- run --scenario scenarios/mission.json --seed 7 --output artifacts/demo
      - name: Recompute sensor log
        run: cargo run --release --locked --bin rustdriving -- replay --log artifacts/demo/sensors.jsonl --output artifacts/demo/replay
      - name: Import attributed OSM roads and drive the resulting graph
        shell: bash
        run: |
          target/release/rustdriving import-osm --input maps/osm/german-road-extract.json --output artifacts/osm/map.json --origin-lat 48.136 --origin-lon 10.0695 --default-half-width 3 --scenario-output artifacts/osm/scenario.json --start osm-node-7119017425 --goal osm-node-274969423
          target/release/rustdriving run --scenario artifacts/osm/scenario.json --seed 7 --output artifacts/osm/run
          target/release/rustdriving replay --log artifacts/osm/run/sensors.jsonl --output artifacts/osm/replay
      - name: Independently check opt-in sparse-road corners in the reference plant
        shell: bash
        run: |
          python scripts/test-checker-portability.py
          python scripts/check-local-corners.py --output artifacts/local-corners
      - name: Drive legal turns and verify restricted-map sensor replay
        shell: bash
        run: python scripts/check-turn-restrictions.py --backend reference --seeds 7 --compact --output artifacts/turn-restrictions
      - name: Drive mapped destinations, closure detour and mapped road rules
        shell: bash
        run: |
          for case in route-direct route-detour route-south route-handover route-no-path route-reopen signal-red-green signal-red-stop signal-stale-stop signal-stale-recovery signal-two-stops signal-approach-change stop-sign-single stop-sign-two stop-sign-signal stop-sign-obstacle stop-sign-gnss-recovery intersection-crossing intersection-successive intersection-blocked intersection-gnss-recovery intersection-stop-sign intersection-fast-wide intersection-slow-narrow intersection-two-zones intersection-delay-two intersection-lidar-recovery intersection-cadence-five-hz intersection-late-conflict intersection-late-delayed; do
            cargo run --release --locked --bin rustdriving -- run --scenario "scenarios/$case.json" --seed 7 --output "artifacts/routing/$case"
            cargo run --release --locked --bin rustdriving -- replay --log "artifacts/routing/$case/sensors.jsonl" --output "artifacts/routing/$case/replay"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ matrix.os }}
          path: |
            artifacts/demo/
            artifacts/routing/
            artifacts/osm/
            artifacts/local-corners/
            artifacts/turn-restrictions/
            artifacts/datasets/*.json
            artifacts/map-localization/
            artifacts/speed-zones/
            artifacts/lane-speed-zones/
            artifacts/lane-change-speeds/
            artifacts/lane-return-speeds/
            artifacts/lane-resume-speeds/
            artifacts/navigation-speeds/
            artifacts/mid-edge/
            artifacts/mid-edge-corpus/
            artifacts/initial-pose/
            artifacts/gnss-covariance/
            artifacts/gnss-recovery/
            artifacts/gnss-antenna/
            artifacts/motion-continuity/
            artifacts/regional-relocalization/
            artifacts/relocalization-map-only/
            artifacts/gnss-handoff/
            artifacts/navigation-relocalization/
            artifacts/navigation-handover/
            artifacts/stop-relocalization/
            artifacts/signal-relocalization/
            artifacts/yield-relocalization/
            artifacts/gnss-latency/
  image-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check independent image tracking library and CLI
        run: |
          cargo fmt --manifest-path integrations/camera-tracking/Cargo.toml --check
          cargo clippy --manifest-path integrations/camera-tracking/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --release --manifest-path integrations/camera-tracking/Cargo.toml --locked
          cargo build --release --manifest-path integrations/camera-tracking/Cargo.toml --locked
      - name: Enumerate association optima and verify temporal failure behavior
        run: |
          python integrations/camera-tracking/check.py --binary integrations/camera-tracking/target/release/rustdriving-camera-track --output artifacts/image-tracking-v1/ci
          cp assets/camera-analysis-v1/LICENSE-data.txt artifacts/image-tracking-v1/ci/LICENSE-data.txt
      - name: Verify camera acquisition and delivery clocks with injected faults
        run: |
          python integrations/camera-tracking/freshness_check.py --output artifacts/camera-freshness-v1/ci
          cp assets/camera-freshness-v1/LICENSE-data.txt artifacts/camera-freshness-v1/ci/LICENSE-data.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-tracking-controls
          path: |
            artifacts/image-tracking-v1/ci/
            artifacts/camera-freshness-v1/ci/
  kitti-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and analytic checker
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install -r scripts/requirements-visual.txt
      - name: Check sparse-depth Rust and build projection tools
        run: |
          cargo fmt --manifest-path integrations/kitti-depth/Cargo.toml --check
          cargo clippy --manifest-path integrations/kitti-depth/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path integrations/kitti-depth/Cargo.toml --locked
          cargo build --release --manifest-path integrations/kitti-depth/Cargo.toml --locked
          cargo build --release --manifest-path integrations/rgbd/Cargo.toml --locked --bin rustdriving-kitti-project
      - name: Independently reconstruct four-camera sparse depth and reject malformed inputs
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/check-kitti-depth.py --projection-binary integrations/rgbd/target/release/rustdriving-kitti-project --depth-binary integrations/kitti-depth/target/release/rustdriving-kitti-depth --output artifacts/kitti-depth/analytic
      - name: Verify conditional depth metrics, coverage, frozen inputs and retained failures
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/test-evaluate-kitti-depth.py
          python -m py_compile scripts/evaluate-kitti-depth.py scripts/fetch-argoverse-depth-sample.py scripts/check-argoverse-sparse-depth.py scripts/diagnose-argoverse-sparse-depth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitti-depth-analytic
          path: artifacts/kitti-depth/**/*.json
  projective-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and independent numerical checker
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install -r scripts/requirements-visual.txt
      - name: Check independent projective-depth Rust library and transport
        run: |
          cargo fmt --manifest-path integrations/projective-depth/Cargo.toml --check
          cargo clippy --all-targets --locked --manifest-path integrations/projective-depth/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path integrations/projective-depth/Cargo.toml
          cargo build --release --locked --manifest-path integrations/projective-depth/Cargo.toml
      - name: Reconstruct analytic motion and reject transport and report corruptions
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/check-projective-fixed-map.py --binary integrations/projective-depth/target/release/rustdriving-projective-fixed-map --output artifacts/projective-depth/fixed-map-controls
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/analytic
          python scripts/check-projective-depth-supervision.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth-supervised --base-binary integrations/projective-depth/target/release/rustdriving-projective-depth --analytic-only --output artifacts/projective-depth/supervision
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/analytic --output artifacts/projective-depth/raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --reprojection tangent_plane --output artifacts/projective-depth/tangent-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/tangent-analytic --reprojection tangent_plane --output artifacts/projective-depth/tangent-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --correspondence reciprocal --output artifacts/projective-depth/reciprocal-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/reciprocal-analytic --correspondence reciprocal --output artifacts/projective-depth/reciprocal-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual symmetric_planes --output artifacts/projective-depth/symmetric-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/symmetric-analytic --residual symmetric_planes --output artifacts/projective-depth/symmetric-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual symmetric_midpoint --output artifacts/projective-depth/midpoint-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/midpoint-analytic --residual symmetric_midpoint --output artifacts/projective-depth/midpoint-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual bidirectional_midpoint --output artifacts/projective-depth/bidirectional-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/bidirectional-analytic --residual bidirectional_midpoint --output artifacts/projective-depth/bidirectional-raw-audit
          python scripts/check-projective-surface-math.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/surface-math
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual depth_variance_plane --output artifacts/projective-depth/range-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/range-analytic --residual depth_variance_plane --output artifacts/projective-depth/range-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual depth_whitened_plane --output artifacts/projective-depth/whitened-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/whitened-analytic --residual depth_whitened_plane --output artifacts/projective-depth/whitened-raw-audit
          python scripts/check-projective-range.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/range-controls
          python scripts/check-projective-range.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --residual depth_whitened_plane --output artifacts/projective-depth/whitened-controls
          python scripts/diagnose-projective-fusion.py --controls-only --output artifacts/projective-depth/fusion-bias-controls
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --fusion-sampling visible_mean --output artifacts/projective-depth/fusion-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/fusion-analytic --fusion-sampling visible_mean --output artifacts/projective-depth/fusion-raw-audit
          python scripts/check-projective-fusion.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/fusion-controls
          python scripts/diagnose-projective-visibility.py --controls-only --output artifacts/projective-depth/visibility-math
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --visibility free_space_decay --output artifacts/projective-depth/visibility-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/visibility-analytic --visibility free_space_decay --output artifacts/projective-depth/visibility-raw-audit
          python scripts/check-projective-visibility.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/visibility-controls
          python scripts/check-projective-camera.py --output artifacts/projective-depth/camera-math
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --correspondence bilinear --output artifacts/projective-depth/bilinear-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/bilinear-analytic --correspondence bilinear --output artifacts/projective-depth/bilinear-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --normals inverse_depth_plane --output artifacts/projective-depth/plane-normal-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/plane-normal-analytic --normals inverse_depth_plane --output artifacts/projective-depth/plane-normal-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --geometry vertices --output artifacts/projective-depth/vertex-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/vertex-analytic --geometry vertices --output artifacts/projective-depth/vertex-raw-audit
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --photometric keyframe --output artifacts/projective-depth/rgbd-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/rgbd-analytic --photometric keyframe --output artifacts/projective-depth/rgbd-raw-audit
          python scripts/check-projective-rgbd-lifecycle.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/rgbd-lifecycle
          python scripts/check-projective-rgbd-exposure.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/rgbd-exposure
          python scripts/check-projective-step-control.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/rgbd-step-control
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --motion-model constant_velocity --output artifacts/projective-depth/motion-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/motion-analytic --output artifacts/projective-depth/motion-raw-audit
          python scripts/check-projective-motion.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/motion-lifecycle
          python scripts/check-projective-report-write.py --output artifacts/projective-depth/report-write-controls
          python scripts/check-projective-calibration-math.py --output artifacts/projective-depth/calibration-math
          python scripts/check-projective-timing.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --output artifacts/projective-depth/timing-controls
          python scripts/check-projective-rgbd-lifecycle.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --timing previous_motion --output artifacts/projective-depth/timing-lifecycle
          python scripts/check-projective-depth.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --photometric keyframe --step-control fixed_support --output artifacts/projective-depth/guarded-analytic
          python scripts/audit-projective-depth-raw.py --analytic-only --analytic-reports artifacts/projective-depth/guarded-analytic --photometric keyframe --output artifacts/projective-depth/guarded-raw-audit
          python scripts/check-projective-rgbd-lifecycle.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --step-control fixed_support --output artifacts/projective-depth/guarded-lifecycle
          python scripts/check-projective-rgbd-exposure.py --binary integrations/projective-depth/target/release/rustdriving-projective-depth --step-control fixed_support --output artifacts/projective-depth/guarded-exposure
          python scripts/check-multireference-rgbd.py --binary integrations/projective-depth/target/release/rustdriving-multireference-rgbd --output artifacts/projective-depth/multireference
          python scripts/check-joint-keyframe-depth.py --output artifacts/projective-depth/joint-keyframes
          python scripts/check-marginalized-keyframes.py --output artifacts/projective-depth/marginalized-keyframes
          python scripts/check-subpixel-keyframes.py --output artifacts/projective-depth/subpixel-keyframes
          python scripts/check-symmetric-keyframes.py --output artifacts/projective-depth/symmetric-keyframes
          python scripts/check-robust-keyframes.py --output artifacts/projective-depth/robust-keyframes
          python scripts/check-patch-keyframes.py --output artifacts/projective-depth/patch-keyframes
          python scripts/check-selective-keyframes.py --output artifacts/projective-depth/selective-keyframes
