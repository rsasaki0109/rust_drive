      - name: Reproduce viewed pixel-refined RGB-D motion and independent reprojection checks
        run: |
          python scripts/fetch-reprojection-dataset.py tum-fr2-desk-reprojection
          python scripts/check-recorded-reprojection-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-evaluate --output artifacts/recorded-reprojection
      - name: Qualify metadata before images and reproduce the frozen room trial
        run: |
          python scripts/test-qualify-rgbd-metadata.py
          python scripts/fetch-qualified-dataset.py tum-fr1-room-qualified
          python scripts/check-recorded-qualified-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-qualified --output artifacts/recorded-qualified
      - name: Reproduce continuous room motion with a partly viewed prefix
        run: |
          python scripts/test-qualify-rgbd-temporal.py
          python scripts/fetch-temporal-dataset.py tum-fr1-room-temporal
          python scripts/check-recorded-temporal-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-temporal --output artifacts/recorded-temporal
      - name: Reproduce viewed depth-supported matching and preserve its physical outcome
        run: python scripts/check-recorded-supported-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-supported --output artifacts/recorded-supported
      - name: Exercise bounded patch tracking and retain synthetic ambiguity failures
        run: |
          rustc --edition 2024 -O scripts/exercise-pyramidal-tracking.rs -o artifacts/exercise-pyramidal-tracking
          artifacts/exercise-pyramidal-tracking > artifacts/pyramidal-tracking-synthetic-exercises.json
      - name: Reproduce viewed pyramidal image tracking with all179 outcomes retained
        run: python scripts/check-recorded-tracked-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-tracked --output artifacts/recorded-tracked
      - name: Validate bounded official-archive acquisition and independent recording controls
        run: |
          python scripts/test-independent-dataset.py
          python scripts/check-recorded-independent.py --self-test --synthetic-packet artifacts/recorded-independent/rust-fixture/fixture.json --output artifacts/recorded-independent/self-test.json
      - name: Reproduce the viewed official desk2 failure and corrected independent audit
        run: |
          python scripts/fetch-independent-dataset.py tum-fr1-desk2-independent --archive "$RUNNER_TEMP/rustdriving-desk2-source.tgz" --preregistration assets/recorded-independent/desk2-v1/design.json --acquisition-log artifacts/recorded-independent/official-acquisition.json
          python scripts/check-recorded-independent-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-independent --archive "$RUNNER_TEMP/rustdriving-desk2-source.tgz" --manifest data/tum-fr1-desk2-independent/manifest.json --raw data/tum-fr1-desk2-independent/raw --output artifacts/recorded-independent/viewed-regression
      - name: Audit bounded multiscale features on analytic controls and both viewed recordings
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          integrations/rgbd/target/release/rustdriving-rgbd-multiscale-pairs --control --output artifacts/multiscale-pairs/control.json
          python scripts/check-multiscale-features.py --report artifacts/multiscale-pairs/control.json --output artifacts/multiscale-pairs/control-oracle.json
          for dataset in tum-fr1-room-temporal tum-fr1-desk2-independent; do
            integrations/rgbd/target/release/rustdriving-rgbd-multiscale-pairs --prepare-freeze --manifest "data/$dataset/manifest.json" --output "artifacts/multiscale-pairs/$dataset-freeze.json"
            integrations/rgbd/target/release/rustdriving-rgbd-multiscale-pairs --manifest "data/$dataset/manifest.json" --raw "data/$dataset/raw" --freeze "artifacts/multiscale-pairs/$dataset-freeze.json" --output "artifacts/multiscale-pairs/$dataset-report.json"
            python scripts/check-multiscale-features.py --report "artifacts/multiscale-pairs/$dataset-report.json" --manifest "data/$dataset/manifest.json" --raw "data/$dataset/raw" --freeze "artifacts/multiscale-pairs/$dataset-freeze.json" --output "artifacts/multiscale-pairs/$dataset-oracle.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {"tum-fr1-room-temporal": (138, 165), "tum-fr1-desk2-independent": (124, 154)}
          for dataset, (native, multi) in expected.items():
              report = json.loads(Path(f"artifacts/multiscale-pairs/{dataset}-report.json").read_text())
              assert report["summary"] == {
                  "total_pairs": 179,
                  "native": {"fitted": native, "accurate": native, "scorable": 179},
                  "multiscale": {"fitted": multi, "accurate": multi, "scorable": 179},
              }, "viewed pair result changed; retain and inspect every failure"
          PY
      - name: Audit continuous multiscale state controls and reproduce viewed motion failures
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          integrations/rgbd/target/release/rustdriving-rgbd-multiscale-temporal --control --output artifacts/multiscale-temporal/control.json
          python scripts/check-multiscale-temporal.py --report artifacts/multiscale-temporal/control.json --output artifacts/multiscale-temporal/control-oracle.json
          python scripts/check-multiscale-temporal.py --self-test --output artifacts/multiscale-temporal/state-self-test.json
          python scripts/check-multiscale-temporal-suite.py --self-test --output artifacts/multiscale-temporal/suite-controls
          python scripts/check-multiscale-temporal-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-multiscale-temporal --output artifacts/multiscale-temporal/viewed-regression
      - name: Audit registered-grid camera controls and reproduce viewed motion failures
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          integrations/rgbd/target/release/rustdriving-rgbd-registered-grid-temporal --control --output artifacts/registered-grid-temporal/control.json
          python scripts/check-registered-grid-temporal.py --report artifacts/registered-grid-temporal/control.json --output artifacts/registered-grid-temporal/control-oracle.json
          python scripts/check-registered-grid-temporal.py --self-test --output artifacts/registered-grid-temporal/model-self-test.json
          python scripts/check-registered-grid-temporal-suite.py --self-test --output artifacts/registered-grid-temporal/suite-controls
          python scripts/check-registered-grid-temporal-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-registered-grid-temporal --output artifacts/registered-grid-temporal/viewed-regression
      - name: Reproduce authored KITTI-format projection and input-contract controls
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          cargo build --release --manifest-path integrations/rgbd/Cargo.toml --locked --bin rustdriving-kitti-project
          python scripts/check-kitti-calibration.py --prepare-fixture --output artifacts/kitti-projection/fixture
          python scripts/check-kitti-calibration.py --self-test --fixture artifacts/kitti-projection/fixture --output artifacts/kitti-projection/analytic
          python scripts/check-kitti-calibration.py --binary integrations/rgbd/target/release/rustdriving-kitti-project --fixture artifacts/kitti-projection/fixture --output artifacts/kitti-projection/audit
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          assets = Path("assets/kitti-projection-v1")
          packet_path = assets / "evidence.json"
          assert packet_path.is_file() and not packet_path.is_symlink()
          packet_bytes = packet_path.read_bytes()
          assert hashlib.sha256(packet_bytes).hexdigest() == "a65fc349faabe9fa861cb1924079b49da66612e3c048c76a44db96ba422fc5a8"
          packet = json.loads(packet_bytes)
          assert len(packet["bound_files"]) == 19
          for name, pin in packet["bound_files"].items():
              assert Path(name).name == name and name not in (".", "..")
              path = assets / name
              assert path.is_file() and not path.is_symlink()
              assert path.stat().st_size == pin["bytes"] <= 4 * 1024 * 1024
              assert hashlib.sha256(path.read_bytes()).hexdigest() == pin["sha256"]
          identity = packet["source_and_binary_identity"]
          assert identity["sources"].keys() == identity["paths"].keys()
          for key, path in identity["paths"].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == identity["sources"][key]
          proof = json.loads(Path("artifacts/kitti-projection/audit/results.json").read_text())
          assert proof["schema"] == "independent-authored-kitti-calibration-oracle-v1"
          assert proof["integrity_and_actual_geometry_passed"] is True
          assert proof["compiled_sources"] == identity["sources"]
          assert proof["actual_positive_cli_runs"] == 4
          assert len(proof["cameras"]) == 4
          assert sum(camera["every_row_checked"] for camera in proof["cameras"]) == 72
          assert all(proof[key] is False for key in
                     ("actual_kitti_data", "camera_images", "ground_truth_labels",
                      "calibration_physically_measured", "accuracy_claim"))
          for camera in range(4):
              actual = Path(f"artifacts/kitti-projection/audit/camera-{camera}.json")
              assert actual.read_bytes() == (assets / f"first-camera-{camera}.json").read_bytes()
          PY
      - name: Remove generated KITTI guard symlinks before evidence upload
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path("artifacts/kitti-projection")
          assert not root.is_symlink()
          for directory, subdirectories, files in os.walk(root, followlinks=False):
              for name in subdirectories + files:
                  path = Path(directory) / name
                  if path.is_symlink():
                      path.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-cpu-evidence
          path: |
            artifacts/camera-model/check/
            artifacts/camera-model/summary.json
            artifacts/road-camera/check/
            artifacts/bdd-camera/check/
            artifacts/yolox-s-bdd-v1/controls/
            artifacts/yolox-s-bdd-v1/reproduction/
            artifacts/yolox-s-bdd-v1/ci-launch-receipt.json
            artifacts/yolox-s-tiles-v1/controls/
            artifacts/yolox-s-tiles-v1/regression/
            artifacts/yolox-vehicle-consistency-v1/controls/
            artifacts/yolox-vehicle-consistency-v1/reproduction/
            artifacts/camera-analysis-v1/controls/summary.json
            artifacts/camera-analysis-v1/controls/executable.json
            artifacts/camera-analysis-v1/regression/
            artifacts/camera-sequence-v1/controls/summary.json
            artifacts/camera-sequence-v1/controls/executable.json
            artifacts/camera-sequence-v1/sequence.json
            artifacts/camera-sequence-v1/recorded/
            artifacts/camera-pipeline-v1/controls/
            artifacts/camera-pipeline-v1/recorded/
            artifacts/camera-latency-v1/controls/
            artifacts/camera-latency-v1/measured/
            artifacts/camera-parallel-v1/controls/
            artifacts/camera-parallel-v1/verification/
            artifacts/camera-cpu-v1/build/*.json
            artifacts/camera-cpu-v1/build/build.log
            artifacts/camera-cpu-v1/controls/
            artifacts/camera-cpu-v1/verification/
            artifacts/camera-operators-v2/
            artifacts/adaptive/
            artifacts/rgbd/
            artifacts/recorded-motion/
            artifacts/recorded-keyframes/
            artifacts/recorded-submaps/
            artifacts/recorded-visual/
            artifacts/recorded-reprojection/
            artifacts/recorded-qualified/
            artifacts/recorded-temporal/
            artifacts/recorded-supported/
            artifacts/recorded-tracked/
            artifacts/recorded-independent/
            artifacts/multiscale-pairs/
            artifacts/multiscale-temporal/
            artifacts/registered-grid-temporal/
            artifacts/kitti-projection/**/*.json
            artifacts/kitti-projection/**/*.log
            artifacts/pyramidal-tracking-synthetic-exercises.json

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdriving-rustup" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r scripts/requirements-demo.txt
      - name: Regenerate the actual demo
        run: bash scripts/demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: artifacts/demo/demo.*

  rne-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust_drive
      - uses: actions/checkout@v4
        with:
          repository: rsasaki0109/RobotNativeEngine
          ref: df6007aa40315e81d12ae00fc1f60369e393a178
          path: RobotNativeEngine
          sparse-checkout: |
            crates
            third_party
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustdriving-rustup" >> "$GITHUB_ENV"
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify engine pin and CPU adapter
        working-directory: rust_drive
        run: |
          test "$(git -C ../RobotNativeEngine rev-parse HEAD)" = "$(cat integrations/rne/rne-revision.txt)"
          cargo +1.95.0 fmt --manifest-path integrations/rne/Cargo.toml --check
          cargo +1.95.0 clippy --release --manifest-path integrations/rne/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.95.0 test --release --manifest-path integrations/rne/Cargo.toml --locked
      - name: Run both native plants and verify logs
        working-directory: rust_drive
        run: |
          for plant in kinematic dynamic; do
            cargo +1.95.0 run --release --locked --manifest-path integrations/rne/Cargo.toml -- --scenario scenarios/mission.json --plant "$plant" --seed 7 --output "artifacts/rne-$plant"
            cargo run --release --locked --bin rustdriving -- replay --log "artifacts/rne-$plant/sensors.jsonl" --output "artifacts/rne-$plant/replay"
          done
      - name: Run multi-seed hazard acceptance and full replay
        working-directory: rust_drive
        run: python3 scripts/check_hazards.py
      - name: Independently check native scenes, multi-height sensing and remaining blind slabs
        working-directory: rust_drive
        run: python3 scripts/check-native-scenes.py --output artifacts/native-scenes
      - name: Independently check inclined 3D returns, projection and remaining field-of-view failures
        working-directory: rust_drive
        run: python3 scripts/check-lidar-3d.py --output artifacts/lidar-3d --compact
      - name: Independently check measured ground removal and rectangular-body clearance
        working-directory: rust_drive
        run: python3 scripts/check-ground-scenes.py --output artifacts/ground-scenes --compact
      - name: Drive imported OSM roads with physical ground and the research body
        working-directory: rust_drive
        run: python3 scripts/check-osm-scenes.py --output artifacts/osm-scenes --compact
      - name: Drive unchanged sparse bends in both plants with calibrated chassis motion
        working-directory: rust_drive
        run: python3 scripts/check-local-corners.py --backend all --compact --output artifacts/local-corners
      - name: Verify native GNSS-denied driving, expiry and sensor-loss controls
        working-directory: rust_drive
        run: python3 scripts/check-map-localization.py --backend rne-dynamic --output artifacts/map-localization
      - name: Verify native correlated GNSS and retain known narrow-axis bias failures
        working-directory: rust_drive
        run: |
          python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(['python3', 'scripts/check_gnss_covariance.py', '--plant', 'rne-dynamic', '--seeds', '7', '--output', 'artifacts/gnss-covariance-native'])
          report = json.load(open('artifacts/gnss-covariance-native/report.json'))
          assert result.returncode == 1 and report['complete'] and not report['passed']
          rows = report['episodes']
          assert len(rows) == 8
          assert all('audit_error' not in r and r['oracle']['passed'] and r['noise_samples_verified'] > 0 and r['replay_exit_code'] == 0 and r['replay']['verified'] for r in rows)
          for row in rows:
              assert row['summary']['reached_goal'] and not row['summary']['collisions'] and not row['summary']['road_violations']
              if row['calibrated']:
                  assert set(row['failed_gates']) == ({'source_acceptance', 'localization_accuracy', 'fault_stop_recovery'} if row['world'].endswith('bias') else set())
              else:
                  assert set(row['failed_gates']) <= {'source_acceptance'}
          PY
      - name: Independently verify experimental XYZ terrain and measured actor AABBs
        working-directory: rust_drive
        run: python3 scripts/check-terrain-objects.py --compact --output artifacts/terrain-objects
      - name: Verify native bounded GNSS recovery with map, no-guard and expiry controls
        working-directory: rust_drive
        run: python3 scripts/check_gnss_recovery.py --plant rne-dynamic --smoke --output artifacts/gnss-recovery-native
      - name: Verify native calibrated GNSS antenna mounts and preserve controls
        working-directory: rust_drive
        run: python3 scripts/check_gnss_antenna.py --plant rne-dynamic --smoke --output artifacts/gnss-antenna-native
      - name: Verify native physical stops after motion continuity loss
        working-directory: rust_drive
        run: python3 scripts/check_motion_continuity.py --plant rne-dynamic --smoke --output artifacts/motion-continuity-native
      - name: Verify native measured recovery and conservative regional rejection
        working-directory: rust_drive
        run: |
          python3 -m pip install -r scripts/requirements-relocalization.txt
          python3 scripts/check_relocalization.py --plant rne-dynamic --smoke --output artifacts/regional-relocalization-native
      - name: Verify native map-only driving, GNSS handoff and bounded stops
        working-directory: rust_drive
        run: python3 scripts/check_relocalization_map_only.py --plant rne-dynamic --smoke --output artifacts/relocalization-map-only-native
      - name: Verify native measured-reset GNSS confirmations and expiry
        working-directory: rust_drive
        run: python3 scripts/check_gnss_handoff.py --plant rne-dynamic --smoke --output artifacts/gnss-handoff-native
      - name: Verify native navigation missions through measured localization resets
        working-directory: rust_drive
        run: python3 scripts/check_navigation_relocalization.py --plant rne-dynamic --smoke --output artifacts/navigation-relocalization-native
      - name: Verify native braked stopped-route confirmation
        working-directory: rust_drive
        run: python3 scripts/check_navigation_handover.py --plant rne-dynamic --smoke --output artifacts/navigation-handover-native
      - name: Verify native stop-sign obligations after measured localization recovery
        working-directory: rust_drive
        run: python3 scripts/check_stop_relocalization.py --plant rne-dynamic --smoke --output artifacts/stop-relocalization-native
      - name: Verify native signal permission after measured localization recovery
        working-directory: rust_drive
        run: python3 scripts/check_signal_relocalization.py --plant rne-dynamic --smoke --output artifacts/signal-relocalization-native
      - name: Verify native yield entry ownership after measured recovery
        working-directory: rust_drive
        run: python3 scripts/check_yield_relocalization.py --plant rne-dynamic --smoke --output artifacts/yield-relocalization-native
      - name: Verify legal turn routes in the native dynamic plant
        working-directory: rust_drive
        run: python3 scripts/check-turn-restrictions.py --backend native --seeds 7 --compact --output artifacts/turn-restrictions
      - name: Verify partial routes and retain the native startup-heading quality failure
        working-directory: rust_drive
        run: |
          python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(["python3", "scripts/check_mid_edge.py", "--plant", "rne-dynamic", "--output", "artifacts/mid-edge-native"])
          assert result.returncode == 1, "expected retained heading-quality failure, not input/audit failure"
          report = json.load(open("artifacts/mid-edge-native/report.json"))
          rows = report["episodes"]
          assert len(rows) == 8
          assert {r["case"] for r in rows if not r["passed"]} == {"same-edge", "obstacle", "clipped", "restricted", "handover", "reopen", "blocked-goal"}
          assert all(r["run_exit_code"] == r["replay_exit_code"] == 0 and r["routing_and_physical_contract_passed"] and r["replay"]["verified"] for r in rows)
          assert all(r["failed_gates"] == ([] if r["case"] == "osm" else ["maximum_yaw_error_rad"]) for r in rows)
          PY
      - name: Independently verify recorded pedestrian and cyclist motion
        working-directory: rust_drive
        run: python3 scripts/check-vru-demo.py --compact --output artifacts/vru-demo --report artifacts/vru-demo/report.json
      - name: Verify explicit native pose priors and physical spawn perturbations
        working-directory: rust_drive
        run: python3 scripts/check_initial_pose.py --smoke --plant rne-dynamic --output artifacts/initial-pose-native
      - name: Independently verify urban left-side traffic, signals and recorded dog walking
        working-directory: rust_drive
        run: python3 scripts/check-city-demo.py --compact --output artifacts/city-demo --report artifacts/city-demo/report.json
      - name: Verify Japanese urban intersection exits and physical construction clearance
        working-directory: rust_drive
        run: python3 scripts/check-japan-city-demo.py --compact --output artifacts/japan-city-demo --report artifacts/japan-city-demo/report.json
      - name: Independently verify optional adaptive terrain driving
        working-directory: rust_drive
        run: python3 scripts/check-adaptive-native.py --compact --output artifacts/adaptive-native
