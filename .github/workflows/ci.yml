  opencv-reference-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional pinned reference environment
        run: python -m pip install -r scripts/requirements-opencv-reference.txt
      - name: Check metric depth and nonzero source-to-destination poses
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/compare-opencv-rgbd.py --controls-only --output artifacts/opencv-reference/controls
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('audit', 'scripts/check-opencv-rgbd.py')
          audit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audit)
          audit.controls()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencv-reference-controls
          path: artifacts/opencv-reference/**/*.json
  research-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Verify optional Rust CPU image detector
        run: |
          cargo fmt --manifest-path integrations/onnx/Cargo.toml --check
          cargo clippy --release --manifest-path integrations/onnx/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --release --manifest-path integrations/onnx/Cargo.toml --all-targets --locked
          cargo build --release --manifest-path integrations/onnx/Cargo.toml --all-targets --locked
          python integrations/onnx/check.py --binary integrations/onnx/target/release/rustdriving-camera-detect --summary artifacts/camera-model/summary.json
      - name: Reproduce independently annotated urban-camera diagnostics
        run: |
          python integrations/onnx/road_check.py --binary integrations/onnx/target/release/rustdriving-camera-detect --model artifacts/camera-model/yolox_nano.onnx --data artifacts/road-camera --output artifacts/road-camera/check --baseline integrations/onnx/road-results.json
      - name: Reproduce original BDD dashcam diagnostics and retained misses
        run: |
          mkdir -p artifacts/bdd-camera/check
          python integrations/onnx/bdd_check.py --binary integrations/onnx/target/release/rustdriving-camera-detect --model artifacts/camera-model/yolox_nano.onnx --prepare-freeze artifacts/bdd-camera/check/reproduction-freeze.json
          python integrations/onnx/bdd_check.py --binary integrations/onnx/target/release/rustdriving-camera-detect --model artifacts/camera-model/yolox_nano.onnx --freeze artifacts/bdd-camera/check/reproduction-freeze.json --data artifacts/bdd-camera --output artifacts/bdd-camera/check
          cp assets/recorded-bdd/LICENSE-data.txt artifacts/bdd-camera/check/LICENSE-data.txt
      - name: Reproduce viewed YOLOX-S detections and retain the failed recall gate
        run: |
          python integrations/onnx/fetch_s.py --output artifacts/camera-model-s
          python integrations/onnx/bdd_s_replay.py --self-test --output artifacts/yolox-s-bdd-v1/controls
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, "integrations/onnx/bdd_s_replay.py",
                     "--binary", "integrations/onnx/target/release/rustdriving-camera-detect-s",
                     "--model", "artifacts/camera-model-s/yolox_s.onnx",
                     "--data", "artifacts/bdd-camera",
                     "--output", "artifacts/yolox-s-bdd-v1/reproduction"]
          completed = subprocess.run(command)
          receipt = Path("artifacts/yolox-s-bdd-v1/ci-launch-receipt.json")
          with receipt.open("x") as destination:
              json.dump({"command": command, "actual_wrapper_exit_status": completed.returncode}, destination)
          assert completed.returncode == 1, "expected retained physical failure, not invalid input"
          proof = json.loads(Path("artifacts/yolox-s-bdd-v1/reproduction/results.json").read_text())
          assert proof["integrity_and_reproduction_passed"] is True
          assert proof["viewed_quality_gates_passed"] is False
          assert proof["actual_checker_exit_code"] == proof["first_physical_exit_code"] == 1
          assert proof["actual_inference_runs"] == 16
          assert tuple(proof["overall"][key] for key in
                       ("true_positives", "false_positives", "false_negatives")) == (55, 14, 83)
          PY
      - name: Verify bounded multi-view camera inference and retain failed quality gates
        run: |
          python -m pip install -r scripts/requirements-visual.txt
          python integrations/onnx/bdd_tiles_check.py controls --binary integrations/onnx/target/release/rustdriving-camera-detect-tiled-s --output artifacts/yolox-s-tiles-v1/controls
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, "integrations/onnx/bdd_tiles_check.py", "run",
                     "--binary", "integrations/onnx/target/release/rustdriving-camera-detect-tiled-s",
                     "--controls", "artifacts/yolox-s-tiles-v1/controls",
                     "--output", "artifacts/yolox-s-tiles-v1/regression"]
          completed = subprocess.run(command)
          assert completed.returncode == 1, "retain measured quality failure"
          proof = json.loads(Path("artifacts/yolox-s-tiles-v1/regression/results.json").read_text())
          assert proof["integrity"]["repeated_native_inference_identical"]
          assert proof["integrity"]["independent_merge"]
          assert proof["quality_gates"]["pass"] is False
          assert proof["previous_s_reference_matches"]["retained"] == 55
          assert proof["previous_s_reference_matches"]["lost"] == []
          assert tuple(proof["overall"][key] for key in
                       ("true_positives", "false_positives", "false_negatives")) == (78, 33, 60)
          PY
      - name: Reproduce ambiguity-preserving vehicle report reconciliation
        run: |
          python integrations/onnx/bdd_vehicle_consistency_check.py controls --binary integrations/onnx/target/release/rustdriving-camera-reconcile --output artifacts/yolox-vehicle-consistency-v1/controls
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, "integrations/onnx/bdd_vehicle_consistency_check.py", "run",
                     "--binary", "integrations/onnx/target/release/rustdriving-camera-reconcile",
                     "--controls", "artifacts/yolox-vehicle-consistency-v1/controls",
                     "--parents", "artifacts/yolox-s-tiles-v1/regression",
                     "--output", "artifacts/yolox-vehicle-consistency-v1/reproduction"]
          completed = subprocess.run(command)
          assert completed.returncode == 1, "retain original overall/per-class quality failure"
          proof = json.loads(Path("artifacts/yolox-vehicle-consistency-v1/reproduction/results.json").read_text())
          assert proof["relative_adoption_passed"] is True
          assert proof["quality_gates"]["pass"] is False
          assert proof["previous_tiled_matches"]["retained"] == 78
          assert proof["previous_tiled_matches"]["lost"] == []
          assert proof["integrity"]["postprocessing_repeat_identical"]
          assert proof["integrity"]["new_model_forward_passes"] == 0
          assert tuple(proof["overall"][key] for key in
                       ("true_positives", "false_positives", "false_negatives")) == (78, 31, 60)
          PY
      - name: Verify one-command camera analysis and complete output publication
        run: |
          python integrations/onnx/camera_analysis_check.py controls --binary integrations/onnx/target/release/rustdriving-camera-analyze --output artifacts/camera-analysis-v1/controls
          python integrations/onnx/camera_analysis_check.py run --binary integrations/onnx/target/release/rustdriving-camera-analyze --controls artifacts/camera-analysis-v1/controls --output artifacts/camera-analysis-v1/regression
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path("artifacts/camera-analysis-v1/regression/results.json").read_text())
          assert proof["integrity"]["pass_checks"] is True
          assert proof["integrity"]["native_image_processes"] == 16
          assert proof["integrity"]["model_forward_passes"] == 64
          assert proof["quality_gates"]["pass"] is False
          assert tuple(proof["overall"][key] for key in
                       ("true_positives", "false_positives", "false_negatives")) == (78, 31, 60)
          controls = json.loads(Path("artifacts/camera-analysis-v1/controls/summary.json").read_text())
          assert controls["destination_staging_name_collision_passed"] is True
          PY
      - name: Validate additional measured-data acquisition
        run: |
          python scripts/test-fetch-additional-datasets.py
          python scripts/fetch-additional-datasets.py
