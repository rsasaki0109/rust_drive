          cargo fmt --manifest-path integrations/rgbd/Cargo.toml --check
          cargo clippy --release --manifest-path integrations/rgbd/Cargo.toml --all-targets --locked -- -D warnings
          RUSTDRIVING_INDEPENDENT_SYNTHETIC_OUTPUT="$GITHUB_WORKSPACE/artifacts/recorded-independent/rust-fixture" cargo test --release --manifest-path integrations/rgbd/Cargo.toml --locked
