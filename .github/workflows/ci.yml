          python integrations/onnx/camera_parallel_check.py run --controls artifacts/camera-parallel-v1/controls --output artifacts/camera-parallel-v1/verification
          cp assets/camera-parallel-v1/LICENSE-TUM-data.txt artifacts/camera-parallel-v1/verification/LICENSE-TUM-data.txt
          cp assets/camera-parallel-v1/LICENSE-BDD-data.txt artifacts/camera-parallel-v1/verification/LICENSE-BDD-data.txt
          python - <<'PY'
