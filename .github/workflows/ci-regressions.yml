name: CI regression checks

on:
  push:
    branches: ['codex/ci-*']
  pull_request:
    paths:
      - 'scripts/check_gnss_antenna.py'
      - 'scripts/test_recording_archive.py'
      - 'scripts/recorded_numeric.py'
      - 'scripts/test_recorded_numeric.py'
      - '.github/workflows/ci-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-regressions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable-recordings:
    name: Portable recordings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable receipts, retained bytes and tamper rejection
        run: |
          python scripts/test_recording_archive.py
          python scripts/test_gnss_antenna.py
          python scripts/test_observed_detours.py
          python scripts/test_recorded_numeric.py

  historical-visual:
    name: Frozen RGB-D reproduction (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recorded Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Stage unchanged historical shared libraries
        run: |
          mkdir -p artifacts
          git fetch --no-tags --depth=1 origin a2776053d88bcdcae4e39134c73d95412ff49125
          python scripts/test-rgbd-regression-staging.py
          python scripts/prepare-rgbd-regression.py --output "$RUNNER_TEMP/rustdriving-rgbd-regression"
      - uses: actions/cache/restore@v4
        id: visual-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/rustdriving-rgbd-regression/integrations/rgbd/target
          key: frozen-visual-ubuntu24-rust190-v1-${{ hashFiles('integrations/rgbd/Cargo.lock') }}
      - name: Build the unchanged frozen evaluator
        run: cargo +1.90.0 build --release --locked --manifest-path "$RUNNER_TEMP/rustdriving-rgbd-regression/integrations/rgbd/Cargo.toml"
      - uses: actions/cache/save@v4
        if: steps.visual-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/rustdriving-rgbd-regression/integrations/rgbd/target
          key: ${{ steps.visual-cache.outputs.cache-primary-key }}
      - name: Reproduce all three frozen visual regressions without changing numeric bounds
        working-directory: ${{ runner.temp }}/rustdriving-rgbd-regression
        run: |
          python -m pip install -r scripts/requirements-visual.txt
          python scripts/fetch-visual-datasets.py tum-fr1-desk-visual
          python scripts/fetch-visual-datasets.py tum-fr3-office-visual
          python scripts/fetch-visual-datasets.py tum-fr3-sitting-visual
          python scripts/check-recorded-visual-suite.py --binary integrations/rgbd/target/release/rustdriving-rgbd-evaluate --output artifacts/ci-regressions/recorded-visual
      - name: Preserve numerical failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/ci-regressions/recorded-visual')
          for report in root.glob('*/results.json'):
              baseline = Path('assets/recorded-visual/current-regression') / report.parent.name / 'results.json'
              current, original = json.loads(report.read_text()), json.loads(baseline.read_text())
              print(report.parent.name, 'summaries', original['summary'], current['summary'])
              for index, (left, right) in enumerate(zip(original['frames'], current['frames'])):
                  lq = left.get('root_accuracy', {}).get('estimate', {}).get('quaternion_wxyz')
                  rq = right.get('root_accuracy', {}).get('estimate', {}).get('quaternion_wxyz')
                  if lq is not None and lq != rq:
                      print('frame', index, 'baseline quaternion', lq, 'current quaternion', rq,
                            'delta', [b-a for a, b in zip(lq, rq)])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-visual-ubuntu24
          path: |
            artifacts/ci-regressions/recorded-visual
            ${{ runner.temp }}/rustdriving-rgbd-regression/regression-sources.json
          if-no-files-found: warn

  native-city:
    name: Native red-light queue (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: rust_drive
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust_drive
      - uses: actions/checkout@v4
        with:
          repository: rsasaki0109/RobotNativeEngine
          ref: df6007aa40315e81d12ae00fc1f60369e393a178
          path: RobotNativeEngine
          sparse-checkout: |
            crates
            third_party
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pinned Rust toolchains
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustdriving-rustup" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$RUNNER_TEMP/rustdriving-rustup"
          rustup toolchain install 1.90.0 --profile minimal
          rustup toolchain install 1.95.0 --profile minimal
          test "$(git -C ../RobotNativeEngine rev-parse HEAD)" = "$(cat integrations/rne/rne-revision.txt)"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_drive/target
            rust_drive/integrations/rne/target
          key: native-city-ubuntu24-rust190-195-df6007a-v1-${{ hashFiles('rust_drive/Cargo.lock', 'rust_drive/integrations/rne/Cargo.lock') }}
      - name: Build the active pipeline and pinned native plant
        run: |
          cargo +1.95.0 build --release --locked --manifest-path integrations/rne/Cargo.toml
          cargo +1.90.0 build --release --locked --bin rustdriving
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_drive/target
            rust_drive/integrations/rne/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify frozen city seed 1 with the unchanged eight-second queue gate
        run: |
          python scripts/check-japan-city-demo.py --seeds 1 --compact --output artifacts/ci-regressions/japan --report artifacts/ci-regressions/japan/report.json
      - name: Preserve posthoc queue predicate diagnostics
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/ci-regressions/japan/seed-1/run.json')
          if not path.exists():
              print('No raw city capture remains; see the native checker result.')
              raise SystemExit(0)
          run = json.loads(path.read_text())
          first, second = run['scenario']['traffic_signals']
          def phase(signal, now):
              return next(p['color'] for p in reversed(signal['phases']) if p['from'] <= now + 1e-9)
          crossed, start, longest, interval = False, None, 0., None
          failures, samples = {}, []
          for frame in run['frames']:
              now = frame['time']
              front = frame['truth']['pose']['position']['x'] + run['vehicle']['radius']
              crossed |= front >= first['stop_line']['route_s_m']
              lead = next(actor for actor in frame['objects'] if actor['id'] == 0)
              traffic = next(actor for actor in frame['traffic'] if actor['id'] == 0)
              signal = traffic.get('signal_control')
              margin = second['stop_line']['route_s_m'] - signal['physical_front_s_m'] if signal else None
              checks = dict(first_crossed=crossed, red=phase(second, now) != 'Green',
                            ego_stopped=frame['truth']['speed'] <= .1,
                            lead_stopped=traffic['speed_m_s'] <= .1,
                            lead_nonpermissive=signal is not None and not signal['permissive'],
                            lead_at_margin=margin is not None and .5-1e-8 <= margin <= .55,
                            ego_behind=front < lead['position']['x']-lead['radius'])
              if all(checks.values()):
                  if start is None:
                      start = now
                  if now-start > longest:
                      longest, interval = now-start, [start, now]
              else:
                  start = None
              if 10 <= now < 24:
                  for key, value in checks.items():
                      failures[key] = failures.get(key, 0) + int(not value)
                  if abs(now*2-round(now*2)) < 1e-8:
                      samples.append(dict(time_s=now, ego_speed=frame['truth']['speed'],
                                          lead_speed=traffic['speed_m_s'], lead_margin_m=margin,
                                          ego_front_m=front, lead_rear_m=lead['position']['x']-lead['radius'],
                                          checks=checks))
          result = dict(longest_hold_s=longest, interval_s=interval,
                        failed_predicate_ticks_between_10_and_24_s=failures, samples=samples,
                        scope='Posthoc truth diagnostics only; unchanged checker determines acceptance.')
          output = path.parent.parent / 'queue-diagnostics.json'
          output.write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-city-ubuntu24
          path: rust_drive/artifacts/ci-regressions/japan
          if-no-files-found: warn
