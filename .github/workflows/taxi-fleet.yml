name: Taxi fleet evidence
on:
  push:
    branches: [codex/taxi-fleet]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taxi-fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fleet:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - name: Verify actual fleet and individual demand
        run: node --test web/tests/fleet.test.mjs
