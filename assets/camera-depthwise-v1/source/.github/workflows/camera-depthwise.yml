name: Safe depthwise camera experiment
on:
  push:
    paths:
      - '.github/workflows/camera-depthwise.yml'
      - 'integrations/onnx/**'
      - 'integrations/camera-tracking/**'
      - 'assets/camera-depthwise-v1/**'
      - 'rust-toolchain.toml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  depthwise-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tools and independent checker
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install -r scripts/requirements-visual.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            integrations/onnx/target
            integrations/camera-tracking/target
          key: camera-depthwise-${{ runner.os }}-rust-1.90-${{ hashFiles('integrations/onnx/Cargo.lock', 'integrations/camera-tracking/Cargo.lock') }}
      - name: Check safe row arithmetic and frozen whole-model observations
        run: |
          cargo fmt --manifest-path integrations/onnx/Cargo.toml -- --check
          cargo clippy --release --locked --manifest-path integrations/onnx/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path integrations/onnx/Cargo.toml --bin rustdriving-camera-depthwise
          cargo build --release --locked --manifest-path integrations/onnx/Cargo.toml --bin rustdriving-camera-depthwise --bin rustdriving-camera-nano-repeat2x --bin rustdriving-camera-supervised --bin rustdriving-camera-nano
          cargo build --release --locked --manifest-path integrations/camera-tracking/Cargo.toml
          python -B assets/camera-depthwise-v1/verify.py
          python -B -m unittest discover -s integrations/onnx -p test_camera_depthwise.py -v
      - name: Acquire unchanged pinned models and recordings
        run: |
          python integrations/onnx/fetch.py --output artifacts/camera-model
          python integrations/onnx/fetch_s.py --output artifacts/camera-model-s
          python scripts/fetch-visual-datasets.py tum-fr3-sitting-visual
          python integrations/onnx/bdd_fetch.py --output artifacts/bdd-camera
      - name: Compare raw bits and measured replay without weakening any gate
        run: |
          mkdir -p artifacts/camera-depthwise-check
          cp assets/camera-nano-v1/LICENSE-TUM-data.txt artifacts/camera-depthwise-check/LICENSE-TUM-data.txt
          cp assets/camera-nano-v1/LICENSE-BDD-data.txt artifacts/camera-depthwise-check/LICENSE-BDD-data.txt
          python -B integrations/onnx/camera_depthwise_reproduce.py --output artifacts/camera-depthwise-check/session
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/camera-depthwise-check/session/validation/summary.json').read_text())
          assert r['pass_checks'] and r['full_current_measurement_bits_exact']
          assert r['actual_main_model_forwards'] == 256 + r['timed_model_forwards']
          assert r['actual_all_model_forwards'] == 16 + r['actual_main_model_forwards']
          assert r['raw_output_pairs'] == 64 and r['raw_output_f32_values_compared'] == 19306560
          assert r['independent_guard_replays'] == 8
          assert not r['new_holdout'] and not r['new_accuracy_scoring']
          assert not r['driving_integration'] and not r['hard_real_time_guarantee']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-depthwise
          path: artifacts/camera-depthwise-check/
