[workspace]

[package]
name = "rustdriving-rne"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
rustdriving-core = { path = "../../crates/core" }
rustdriving-pipeline = { path = "../../crates/pipeline" }
rustdriving-sim = { path = "../../crates/sim" }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rne_core = { path = "../../../RobotNativeEngine/crates/rne_core" }
rne_ecs = { path = "../../../RobotNativeEngine/crates/rne_ecs" }
rne_math = { path = "../../../RobotNativeEngine/crates/rne_math" }
rne_world = { path = "../../../RobotNativeEngine/crates/rne_world" }
rne_robot = { path = "../../../RobotNativeEngine/crates/rne_robot" }
rne_physics = { path = "../../../RobotNativeEngine/crates/rne_physics" }
rne_physics_rapier = { path = "../../../RobotNativeEngine/crates/rne_physics_rapier" }
rne_sensor = { path = "../../../RobotNativeEngine/crates/rne_sensor" }

[lints.rust]
unsafe_code = "forbid"
