[package]
name = "rustdriving-kitti-depth"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Bounded sparse axial depth from calibrated KITTI projection reports"

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# Preserve distinct adjacent f64 values when reading the projection report.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
